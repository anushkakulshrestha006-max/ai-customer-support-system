services:
  # FastAPI Backend Web Service
  - type: web
    name: novastore-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python scripts/ingest_documents.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # Streamlit Frontend Web Service
  - type: web
    name: novastore-frontend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run streamlit_app/app.py --server.port $PORT --server.address 0.0.0.0"
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BACKEND_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
