version: '3.8'

services:
  # MySQL Database Service
  mysql_db:
    image: mysql:8.0
    container_name: novastore_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_customer_support}
      MYSQL_USER: ${MYSQL_USER:-support_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-support_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novastore_backend
    restart: unless-stopped
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      PORT: 8001
      MYSQL_HOST: mysql_db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-support_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-support_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_customer_support}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8001
      BACKEND_URL: http://localhost:8001
      CORS_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-1.5-flash}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "8001:8001"

  # Streamlit Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: novastore_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8001
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "8501:8501"

volumes:
  mysql_data:
